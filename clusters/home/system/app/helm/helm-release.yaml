apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: device-plugin
  namespace: flux-system
spec:
  interval: 10m
  releaseName: device-plugin
  targetNamespace: kube-system
  chartRef:
    kind: OCIRepository
    name: generic-device-plugin
  valuesFrom:
    - kind: ConfigMap
      name: device-plugin-helm-values
