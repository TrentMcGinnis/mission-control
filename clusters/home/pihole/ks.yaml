apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: pihole
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 1m
  timeout: 10m
  path: ./clusters/home/pihole/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  dependsOn:
    - name: truenas
    - name: cert-manager-issuer
  healthChecks:
    - apiVersion: v1
      kind: PersistentVolumeClaim
      name: pihole-data
      namespace: pihole
    - apiVersion: apps/v1
      kind: Deployment
      name: pihole
      namespace: pihole
    - apiVersion: cert-manager.io/v1
      kind: Certificate
      name: pihole
      namespace: pihole
