apiVersion: apps/v1
kind: Deployment
metadata:
  name: pihole
  namespace: pihole
spec:
  replicas: 1
  minReadySeconds: 10
  progressDeadlineSeconds: 600
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: pihole
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pihole
    spec:
      automountServiceAccountToken: false
      # The hostPort address belongs to this node; update both if it moves.
      nodeSelector:
        kubernetes.io/hostname: k8s0
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: pihole
          image: docker.io/pihole/pihole:2026.11.0
          ports:
            - name: dns-tcp
              containerPort: 53
              hostIP: 10.0.3.1
              hostPort: 53
              protocol: TCP
            - name: dns-udp
              containerPort: 53
              hostIP: 10.0.3.1
              hostPort: 53
              protocol: UDP
            - name: http
              containerPort: 80
          env:
            - name: TZ
              value: America/New_York
            - name: FTLCONF_dns_listeningMode
              value: ALL
            # Explicit upstreams avoid forwarding queries back through the router.
            - name: FTLCONF_dns_upstreams
              value: "1.1.1.1;1.0.0.1"
            - name: FTLCONF_webserver_port
              value: "80"
            - name: FTLCONF_webserver_api_password
              valueFrom:
                secretKeyRef:
                  name: pihole-admin
                  key: password
            - name: FTLCONF_dhcp_active
              value: "false"
            - name: FTLCONF_ntp_ipv4_active
              value: "false"
            - name: FTLCONF_ntp_ipv6_active
              value: "false"
            - name: FTLCONF_ntp_sync_active
              value: "false"
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
          startupProbe:
            httpGet:
              path: /admin/
              port: http
            timeoutSeconds: 5
            periodSeconds: 10
            failureThreshold: 30
          # Resolve Pi-hole's built-in name without depending on Internet access.
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -ec
                - dig +time=2 +tries=1 +short @127.0.0.1 pi.hole A | grep -q .
            timeoutSeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: dns-tcp
            timeoutSeconds: 5
            periodSeconds: 10
            failureThreshold: 6
          volumeMounts:
            - name: data
              mountPath: /etc/pihole
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: pihole-data
