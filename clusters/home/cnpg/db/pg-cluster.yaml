apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: main
  namespace: cnpg-system
spec:
  instances: 1
  storage:
    storageClass: truenas-iscsi
    size: 10Gi
  imageName: ghcr.io/tensorchord/cloudnative-vectorchord:18.6-1.1.1
  postgresql:
    shared_preload_libraries:
      - "vchord.so"
