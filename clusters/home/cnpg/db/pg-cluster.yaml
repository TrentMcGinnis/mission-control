apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: main
  namespace: cnpg-system
spec:
  podSecurityContext:
    # Work around containerd's AppArmor stacked-profile bug blocking process signals.
    # https://github.com/containerd/containerd/issues/14485
    # Remove this override once the host runtime/profile fix is deployed and verified.
    appArmorProfile:
      type: Unconfined
    runAsUser: 26
    runAsGroup: 26
    runAsNonRoot: true
    fsGroup: 26
    seccompProfile:
      type: RuntimeDefault
  instances: 1
  storage:
    storageClass: truenas-iscsi
    size: 10Gi
  imageName: ghcr.io/cloudnative-pg/postgresql:18.6-standard-trixie
  postgresql:
    shared_preload_libraries:
      - "vchord.so"
    extensions:
      - name: vchord
        image:
          reference: ghcr.io/tensorchord/vchord-scratch:pg18-v1.1.1
        dynamic_library_path:
          - /usr/lib/postgresql/18/lib
        extension_control_path:
          - /usr/share/postgresql/18/
