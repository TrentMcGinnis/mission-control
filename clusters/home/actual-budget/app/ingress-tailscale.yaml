apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
    name: actual-budget-tailscale
    namespace: actual-budget
    annotations:
        tailscale.com/tags: tag:k8s-actual-budget
spec:
    ingressClassName: tailscale
    tls:
        - hosts:
            - actual-budget
    rules:
        - http:
            paths:
                - path: /
                  pathType: Prefix
                  backend:
                    service:
                        name: actual-budget
                        port:
                            number: 5006
