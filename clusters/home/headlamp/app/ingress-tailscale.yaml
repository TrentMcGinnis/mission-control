apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
    name: headlamp-tailscale
    namespace: headlamp
    annotations:
        tailscale.com/tags: tag:k8s-headlamp
spec:
    ingressClassName: tailscale
    tls:
        - hosts:
            - headlamp
    rules:
        - http:
            paths:
                - path: /
                  pathType: Prefix
                  backend:
                    service:
                        name: headlamp
                        port:
                            number: 80
