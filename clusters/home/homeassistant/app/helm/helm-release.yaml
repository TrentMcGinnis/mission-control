apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: homeassistant
  namespace: flux-system
spec:
  interval: 10m
  targetNamespace: homeassistant
  chart:
    spec:
      chart: home-assistant
      version: "0.3.91"
      sourceRef:
        kind: HelmRepository
        name: homeassistant
        namespace: flux-system
      interval: 10m
  valuesFrom:
    - kind: ConfigMap
      name: homeassistant-helm-values
