apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
    name: sparkyfitness-tailscale
    namespace: sparkyfitness
    annotations:
        tailscale.com/tags: tag:k8s-sparkyfitness
spec:
    ingressClassName: tailscale
    tls:
        - hosts:
            - sparkyfitness
    rules:
        - http:
            paths:
                - path: /
                  pathType: Prefix
                  backend:
                    service:
                        name: sparkyfitness-frontend
                        port:
                            number: 80
