installCRDs: true

# Flux creates this SOPS-encrypted Secret alongside the HelmRelease.
oauthSecretVolume:
  secret:
    secretName: operator-oauth

operatorConfig:
  hostname: tailscale-operator
  defaultTags:
    - tag:k8s-operator
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 512Mi

proxyConfig:
  defaultTags: tag:k8s

# Authenticate API requests using the caller's Tailscale identity.
# Kubernetes RBAC grants monitoring access separately.
apiServerProxyConfig:
  mode: "true"
  allowImpersonation: "true"
