fullnameOverride: minecraft

image:
  repository: itzg/minecraft-server
  # Match Crafty's Java major version.
  tag: java25
  pullPolicy: IfNotPresent

# Import Crafty's server directory into minecraft-data before deployment.
# Use 0 to stop and 1 to start; never run two copies against this world.
replicaCount: 1
strategyType: Recreate
terminationGracePeriodSeconds: 180

resources:
  requests:
    cpu: 500m
    memory: 4Gi
  limits:
    memory: 6Gi

persistence:
  dataDir:
    enabled: true
    existingClaim: minecraft-data

startupProbe:
  enabled: true
  failureThreshold: 90
  periodSeconds: 10

livenessProbe:
  timeoutSeconds: 5
readinessProbe:
  timeoutSeconds: 5

# TCP exposure through the existing Tailscale operator, using its default tags.
serviceAnnotations:
  tailscale.com/expose: "true"
  tailscale.com/hostname: minecraft

minecraftServer:
  eula: "TRUE"
  type: PAPER
  # Do not use LATEST: the first boot must match the existing world/plugins.
  version: "26.1.2"
  worldSaveName: world
  memory: 4G
  serviceType: ClusterIP
  servicePort: 25565
  # Retain gameplay settings from the imported server.properties.
  motd: A Minecraft Server
  overrideServerProperties: false
  rcon:
    enabled: false
  # Copy the existing plugin jars AND their config/data; do not auto-update them.
  pluginUrls: []
  extraPorts:
    - name: bluemap
      containerPort: 8100
      protocol: TCP
      service:
        enabled: true
        embedded: true
        port: 8100

extraEnv:
  # Match the existing Paper build; preserve plugin compatibility during migration.
  PAPER_BUILD: "52"
  # Manual stop/start; no process pausing or automatic shutdown.
  PAUSE_WHEN_EMPTY_SECONDS: "-1"

# Refuse to create a fresh world if the import is missing or nested incorrectly.
initContainers:
  - name: verify-import
    image: busybox:1.37.0
    command:
      - sh
      - -ec
      - |
        if [ ! -s "/data/$WORLD_NAME/level.dat" ]; then
          echo 'Import the Crafty server directory into /data before starting Paper.' >&2
          exit 1
        fi
    env:
      - name: WORLD_NAME
        value: '{{ .Values.minecraftServer.worldSaveName }}'
    securityContext:
      capabilities:
        drop: [ALL]
      readOnlyRootFilesystem: true
      allowPrivilegeEscalation: false
    volumeMounts:
      - name: datadir
        mountPath: /data
        readOnly: true
