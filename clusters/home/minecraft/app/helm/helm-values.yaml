fullnameOverride: minecraft

image:
  repository: itzg/minecraft-server
  # Match Crafty's Java major version.
  tag: java25
  pullPolicy: IfNotPresent

replicaCount: 1
strategyType: Recreate
terminationGracePeriodSeconds: 180

resources:
  requests:
    cpu: 500m
    memory: 1Gi
  limits:
    memory: 4Gi

persistence:
  dataDir:
    enabled: true
    existingClaim: minecraft-data

initContainers:
  - name: configure-bluemap
    image: busybox:1.37.0
    command: ["/bin/sh", "-ec"]
    args:
      - |
        cd /data
        mkdir -p plugins/BlueMap
        cd plugins/BlueMap

        set_config_value() {
          file="$1"
          key="$2"
          value="$3"
          setting="^[[:space:]]*\"?${key}\"?[[:space:]]*[:=][[:space:]]*"

          if [ -f "$file" ] && grep -Eq "$setting" "$file"; then
            sed -i -E "s@($setting)(\"[^\"]*\"|[^[:space:],#/]+)@\1$value@" "$file"
          else
            printf '\n%s: %s\n' "$key" "$value" >> "$file"
          fi
        }

        set_config_value core.conf accept-download true
        set_config_value webserver.conf port 8100
    securityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop: [ALL]
    volumeMounts:
      - name: datadir
        mountPath: /data

startupProbe:
  enabled: true
  failureThreshold: 90
  periodSeconds: 10

livenessProbe:
  timeoutSeconds: 5
readinessProbe:
  timeoutSeconds: 5

# TCP exposure through the existing Tailscale operator, using its default tags.
serviceAnnotations:
  tailscale.com/expose: "true"
  tailscale.com/hostname: minecraft

minecraftServer:
  eula: "TRUE"
  type: PAPER
  version: "26.3"
  worldSaveName: world
  memory: 1G
  serviceType: ClusterIP
  servicePort: 25565
  motd: "Welcome to SPLIT FICTION"
  rcon:
    enabled: false
  pluginUrls:
    - "https://github.com/BlueMap-Minecraft/BlueMap/releases/download/v5.29/bluemap-5.29-paper.jar"
    - "https://hangarcdn.papermc.io/plugins/_PanFiluta_/SingleSleeper/versions/1.0-SNAPSHOT/PAPER/SingleSleeper-1.0-SNAPSHOT.jar"
  extraPorts:
    - name: bluemap
      containerPort: 8100
      protocol: TCP
      service:
        enabled: true
        embedded: true
        port: 8100

extraEnv:
  PAUSE_WHEN_EMPTY_SECONDS: "120"
