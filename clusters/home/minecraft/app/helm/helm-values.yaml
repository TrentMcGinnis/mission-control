fullnameOverride: minecraft

image:
  repository: itzg/minecraft-server
  # Match Crafty's Java major version.
  tag: java25
  pullPolicy: IfNotPresent

replicaCount: 1
strategyType: Recreate
terminationGracePeriodSeconds: 180

resources:
  requests:
    cpu: 500m
    memory: 1Gi
  limits:
    memory: 4Gi

persistence:
  dataDir:
    enabled: true
    existingClaim: minecraft-data

startupProbe:
  enabled: true
  failureThreshold: 90
  periodSeconds: 10

livenessProbe:
  timeoutSeconds: 5
readinessProbe:
  timeoutSeconds: 5

# TCP exposure through the existing Tailscale operator, using its default tags.
serviceAnnotations:
  tailscale.com/expose: "true"
  tailscale.com/hostname: minecraft

minecraftServer:
  eula: "TRUE"
  type: PAPER
  version: "26.3"
  worldSaveName: world
  memory: 1G
  serviceType: ClusterIP
  servicePort: 25565
  motd: "Welcome to SPLIT FICTION"
  rcon:
    enabled: false
  pluginUrls: []
  extraPorts:
    - name: bluemap
      containerPort: 8100
      protocol: TCP
      service:
        enabled: true
        embedded: true
        port: 8100

extraEnv:
  PAPER_BUILD: "249"
  PAUSE_WHEN_EMPTY_SECONDS: "120"
