apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: minecraft
  namespace: flux-system
spec:
  interval: 10m
  releaseName: minecraft
  targetNamespace: minecraft
  timeout: 15m
  chart:
    spec:
      chart: minecraft
      version: "5.2.0"
      sourceRef:
        kind: HelmRepository
        name: itzg
        namespace: flux-system
      interval: 10m
  valuesFrom:
    - kind: ConfigMap
      name: minecraft-helm-values
