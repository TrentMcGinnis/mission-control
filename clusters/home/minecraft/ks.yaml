apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: minecraft
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 1m
  timeout: 15m
  path: ./clusters/home/minecraft/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: truenas
    - name: tailscale-operator
  healthChecks:
    - apiVersion: v1
      kind: PersistentVolumeClaim
      name: minecraft-data
      namespace: minecraft
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: minecraft
      namespace: flux-system
