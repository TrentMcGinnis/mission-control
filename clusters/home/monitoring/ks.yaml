apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: monitoring
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 1m
  timeout: 10m
  path: ./clusters/home/monitoring/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  healthChecks:
  - apiVersion: helm.toolkit.fluxcd.io/v2
    kind: HelmRelease
    name: monitoring
    namespace: flux-system
  - apiVersion: cert-manager.io/v1
    kind: Certificate
    name: grafana
    namespace: monitoring
  dependsOn:
  - name: cert-manager-issuer
  - name: truenas
