# K3s embeds these components and does not expose their standard scrape ports.
kubeEtcd:
  enabled: false
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeProxy:
  enabled: false
defaultRules:
  rules:
    etcd: false
    kubeControllerManager: false
    kubeSchedulerAlerting: false
    kubeSchedulerRecording: false
    kubeProxy: false

grafana:
  admin:
    existingSecret: grafana-admin
    userKey: admin-user
    passwordKey: admin-password
  deploymentStrategy:
    type: Recreate
  persistence:
    enabled: true
    storageClassName: truenas-iscsi
    accessModes:
      - ReadWriteOnce
    size: 1Gi
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 512Mi
  grafana.ini:
    users:
      allow_sign_up: false

prometheus:
  prometheusSpec:
    retention: 14d
    retentionSize: 16GB
    scrapeInterval: 30s
    evaluationInterval: 30s
    # Discover application ServiceMonitors and PodMonitors in all namespaces.
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    resources:
      requests:
        cpu: 250m
        memory: 512Mi
      limits:
        memory: 2Gi
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: truenas-iscsi
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 20Gi
  additionalPodMonitors:
    - name: cnpg-main
      namespaceSelector:
        matchNames:
          - cnpg-system
      selector:
        matchLabels:
          cnpg.io/cluster: main
      podMetricsEndpoints:
        - port: metrics
          interval: 30s

alertmanager:
  alertmanagerSpec:
    resources:
      requests:
        cpu: 25m
        memory: 64Mi
      limits:
        memory: 256Mi
    storage:
      volumeClaimTemplate:
        spec:
          storageClassName: truenas-iscsi
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 1Gi

prometheusOperator:
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 256Mi

kube-state-metrics:
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      memory: 256Mi

prometheus-node-exporter:
  resources:
    requests:
      cpu: 25m
      memory: 32Mi
    limits:
      memory: 128Mi
