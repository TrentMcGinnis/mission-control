apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: immich
  namespace: flux-system
spec:
  interval: 10m
  releaseName: immich
  targetNamespace: immich
  chart:
    spec:
      chart: immich
      version: "0.13.4"
      sourceRef:
        kind: OCIRepository
        name: immich
        namespace: flux-system
      interval: 10m
  valuesFrom:
    - kind: ConfigMap
      name: immich-helm-values
