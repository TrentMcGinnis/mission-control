apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: immich
  namespace: flux-system
spec:
  interval: 10m
  releaseName: immich
  targetNamespace: immich
  chart:
    kind: OCIRepository
    spec:
      interval: 12h
      url: oci://ghcr.io/immich-app/immich-charts/immich
      ref:
        tag: "0.13.4"
  valuesFrom:
    - kind: ConfigMap
      name: immich-helm-values
