apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: immich-db
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 1m
  timeout: 10m
  path: ./clusters/home/immich/db
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  dependsOn:
  - name: cnpg-cluster
  healthChecks:
  - apiVersion: postgresql.cnpg.io/v1
    kind: Database
    name: immich
    namespace: cnpg-system
  - apiVersion: postgresql.cnpg.io/v1
    kind: DatabaseRole
    name: immich
    namespace: cnpg-system
  healthCheckExprs:
  - apiVersion: postgresql.cnpg.io/v1
    kind: Database
    current: has(status.applied) && status.applied && has(status.observedGeneration)
      && status.observedGeneration == metadata.generation
  - apiVersion: postgresql.cnpg.io/v1
    kind: DatabaseRole
    current: has(status.applied) && status.applied && has(status.observedGeneration)
      && status.observedGeneration == metadata.generation
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: immich
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 1m
  timeout: 10m
  path: ./clusters/home/immich
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  dependsOn:
  - name: immich-db
  healthChecks:
  - apiVersion: helm.toolkit.fluxcd.io/v2
    kind: HelmRelease
    name: immich
    namespace: flux-system
